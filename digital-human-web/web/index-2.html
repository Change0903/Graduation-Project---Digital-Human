<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>情感数字人实践 - 语音模式</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #f5f5f5;
            display: flex;
            height: 100vh;
        }

        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            box-sizing: border-box;
        }

        .right-panel {
            flex: 1;
            position: relative;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 20px;
            font-weight: 600;
        }

        .chat-window {
            flex: 1;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 12px;
            overflow-y: auto;
        }

        .msg {
            margin-bottom: 8px;
            line-height: 1.4;
            border-radius: 15px;
            padding: 10px;
            max-width: 60%;
            word-wrap: break-word;
        }

        .msg.user {
            background-color: #4caf50;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .msg.bot {
            background-color: #2196f3;
            color: white;
        }

        .input-bar {
            display: flex;
            margin-top: 12px;
            gap: 8px;
        }

        #userText {
            flex: 1;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.85);
            color: #f9fafb;
            outline: none;
        }

        #userText:focus {
            border-color: #38bdf8;
        }

        #sendBtn,
        #voiceBtn {
            border-radius: 999px;
            border: none;
            padding: 8px 14px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
        }

        #sendBtn:active,
        #voiceBtn:active {
            transform: scale(0.98);
        }

        .avatar-card {
            flex: 1;
            border-radius: 16px;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 50%),
            rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .avatar-header {
            font-size: 14px;
            color: #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatar-header span.label {
            font-weight: 600;
        }

        #avatarVideo {
            width: 100%;
            height: 100%;
            max-height: 320px;
            border-radius: 12px;
            background: #020617;
            object-fit: cover;
        }

        .status-bar {
            font-size: 12px;
            color: #9ca3af;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            background: rgba(15, 23, 42, 0.85);
            color: #f9fafb;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-color: transparent;
        }

        .speed-badge {
            background: #10b981;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="left-panel">
    <div class="mode-switch">
        <a href="index.html" class="mode-btn">视频模式</a>
        <a href="index-2.html" class="mode-btn active">语音模式 <span class="speed-badge">快</span></a>
    </div>
    <h1>情感数字人实践 - 语音模式</h1>
    <div id="chatWindow" class="chat-window"></div>
    <div class="input-bar">
        <input id="userText" placeholder="对数字人说点什么..." />
        <button id="voiceBtn">🎤 说话</button>
        <button id="sendBtn">发送</button>
    </div>
</div>

<div class="right-panel">
    <div class="avatar-card">
        <div class="avatar-header">
            <span class="label">数字人</span>
            <span id="statusText" class="status-bar">等待你的第一句话...</span>
        </div>
        <!-- 初始静态图片会由 JS 设置为 avatar.png -->
        <video id="avatarVideo" muted playsinline></video>
    </div>
    <audio id="replyAudio"></audio>
</div>

<script src="main.js"></script>
</body>
</html>
